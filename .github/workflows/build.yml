name: Build XRemini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms android \
            --project-name xremini \
            --org com.xremini \
            build_app

      - name: Copy XRemini source
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib

      - name: Configure Android SDK
        working-directory: build_app
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle

      - name: Configure AdMob
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace(
                  "</application>",
                  meta + "\n        </application>"
              )

          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      - name: Upload XRemini APK
        uses: actions/upload-artifact@v4
        with:
          name: XRemini-release
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
