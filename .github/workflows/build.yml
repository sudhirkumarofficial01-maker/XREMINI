name: Build XRemini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: |
          flutter create --platforms android --project-name xremini build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib

      - name: Set Android compile SDK
        working-directory: build_app
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          grep -n "compileSdk" android/app/build.gradle

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XRemini-release
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
